name: Build and Push Docker

# Lives under .gitea/workflows (not .github/workflows) — runs on the Gitea
# mirror, not on GitHub. Deliberately no marketplace actions (actions/checkout,
# docker/login-action, docker/setup-buildx-action, ...) — confirmed in another
# project that those don't work against this runner, so everything below is
# plain shell, same style as that project's known-working workflow.
#
# KrabeUI itself is a library, not a server — there's nothing to "run" except
# the Storybook component showcase, so that's what the Dockerfile packages
# (build-storybook -> static export -> served by nginx). This publishes that
# showcase image to the Gitea container registry.
#
# One-time setup on the Gitea side:
#   - Actions enabled for this repo, with a runner labeled "ubuntu-latest" that
#     can run `docker`.
#   - A `REGISTRY_PASSWORD` secret (Settings → Actions → Secrets) — a Gitea
#     access/deploy token with package write access for this repo.
#
# Repo: https://git.krabe.lol/krabe-lol/KrabeUI.git. The image name is
# lowercased (git.krabe.lol/krabe-lol/krabeui) — Docker repository names must
# be lowercase, unlike the git repo path itself.

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git curl docker.io

          # `docker.io` (Debian/Ubuntu's distro package) doesn't bundle buildx, and
          # newer Docker CLIs refuse to fall back to the embedded BuildKit builder
          # via DOCKER_BUILDKIT=1 alone anymore ("BuildKit is enabled but the
          # buildx component is missing") — install it as a CLI plugin directly
          # from GitHub releases instead of pulling in Docker's own apt repo.
          BUILDX_VERSION=$(curl -sSL https://api.github.com/repos/docker/buildx/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          mkdir -p ~/.docker/cli-plugins
          curl -sSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64" -o ~/.docker/cli-plugins/docker-buildx
          chmod +x ~/.docker/cli-plugins/docker-buildx
          docker buildx version

      - name: Clone repository
        env:
          BUILD_COMMIT: ${{ gitea.sha }}
        run: |
          cd /tmp
          rm -rf KrabeUI || true
          git clone https://git.krabe.lol/krabe-lol/KrabeUI.git
          cd KrabeUI
          git checkout --detach "$BUILD_COMMIT"

      - name: Build Docker image
        # The Storybook build (lint/typecheck are separate npm scripts, not run
        # here) happens *inside* the image's build stage (see Dockerfile) rather
        # than as a separate step — this runner only has a working Docker
        # daemon, and `docker run -v hostpath:...` doesn't work against it
        # (Docker-in-Docker: bind mounts resolve on the daemon's host, not this
        # job's own filesystem). `docker build`'s context upload has no such
        # problem, so a failing build just fails this step directly.
        #
        # DOCKER_BUILDKIT=1 switches `docker build` to the daemon's embedded
        # BuildKit builder (built into Docker Engine since 18.09 — no separate
        # `buildx` plugin needed) instead of the legacy builder, which the CLI
        # itself is warning is on its way out.
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          cd /tmp/KrabeUI
          docker build -t git.krabe.lol/krabe-lol/krabeui:latest -f Dockerfile .

      - name: Push to registry
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_PASSWORD" ]; then
            echo "REGISTRY_PASSWORD secret is empty/not set (Settings → Actions → Secrets in Gitea) — aborting." >&2
            exit 1
          fi
          echo "$REGISTRY_PASSWORD" | docker login -u krabe.lol --password-stdin git.krabe.lol
          docker push git.krabe.lol/krabe-lol/krabeui:latest
          docker logout git.krabe.lol || true
